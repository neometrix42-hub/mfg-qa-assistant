# Golden set - the ground truth the whole project is measured against.
#
# TARGET: 50 questions, roughly 20 doc / 20 data / 10 hybrid.
# 22 are written below. The remaining 28 are yours - and writing them is the
# single highest-value hour you will spend on this project.
#
# Write questions from the SOPs and the data, never from the system's output.
# A golden set written after the fact gets unconsciously shaped to what the
# system already does well, and then it measures nothing.
#
# Fields:
#   id               stable identifier, used in the results table
#   question         exactly what a user would type
#   type             doc | data | hybrid
#   expected_chunks  [doc_id#section] - ground truth for recall@k and MRR
#   reference_sql    correct SQL; the harness runs it and compares result sets
#   must_contain     strings that MUST appear in the final answer
#
# Run `python -m evals.run --verify` to check every reference_sql executes.
# It calls no API and costs nothing.

