# ================================================================ DATA (7)

- id: data_001
  question: "How many measurements were recorded in total?"
  type: data
  reference_sql: "SELECT COUNT(*) FROM measurements;"
  must_contain: []

- id: data_002
  question: "How many measurements failed their tolerance in March 2026?"
  type: data
  reference_sql: >
    SELECT COUNT(*) FROM measurements m
    JOIN inspection_runs r USING (run_id)
    WHERE m.in_spec = false
      AND r.inspected_at >= '2026-03-01'
      AND r.inspected_at <  '2026-04-01';
  must_contain: []

- id: data_003
  question: "Which machine has the highest proportion of out-of-tolerance measurements?"
  type: data
  reference_sql: >
    SELECT r.machine_id
    FROM measurements m JOIN inspection_runs r USING (run_id)
    GROUP BY r.machine_id
    ORDER BY COUNT(*) FILTER (WHERE NOT m.in_spec)::float / COUNT(*) DESC
    LIMIT 1;
  must_contain: ["ARM-01"]

- id: data_004
  question: "What is the overall out-of-tolerance rate for each characteristic?"
  type: data
  reference_sql: >
    SELECT characteristic,
           ROUND(100.0 * COUNT(*) FILTER (WHERE NOT in_spec) / COUNT(*), 2) AS pct
    FROM measurements GROUP BY characteristic ORDER BY characteristic;
  must_contain: []

- id: data_005
  question: "How many flatness measurements failed on part P-4417?"
  type: data
  reference_sql: >
    SELECT COUNT(*) FROM measurements m
    JOIN inspection_runs r USING (run_id)
    WHERE r.part_id = 'P-4417'
      AND m.characteristic = 'flatness'
      AND m.in_spec = false;
  must_contain: []

- id: data_006
  question: "Which part number has the most failed measurements?"
  type: data
  reference_sql: >
    SELECT p.part_number
    FROM measurements m
    JOIN inspection_runs r USING (run_id)
    JOIN parts p ON p.part_id = r.part_id
    WHERE m.in_spec = false
    GROUP BY p.part_number ORDER BY COUNT(*) DESC LIMIT 1;
  must_contain: []

- id: data_007
  question: "What date range does the inspection data cover?"
  type: data
  reference_sql: >
    SELECT MIN(inspected_at)::date, MAX(inspected_at)::date FROM inspection_runs;
  must_contain: ["2026"]

# ============================================================== HYBRID (3)

- id: hybrid_001
  question: "Part P-4417 failed a flatness check. What does our procedure require next?"
  type: hybrid
  expected_chunks: ["sop_nonconformance#2.1"]
  must_contain: ["quarantine"]

# Multi-hop: needs the data to spot ARM-01, then the SOP to know what to do.
- id: hybrid_002
  question: >
    One of our machines has a much higher failure rate than the others.
    Which one, and what does the calibration procedure say we should do about it?
  type: hybrid
  expected_chunks: ["sop_calibration#3.2"]
  must_contain: ["ARM-01"]

- id: hybrid_003
  question: >
    How many P-4417 measurements failed, and how long must we keep the
    non-conformance records for them?
  type: hybrid
  expected_chunks: ["sop_nonconformance#5"]
  reference_sql: >
    SELECT COUNT(*) FROM measurements m
    JOIN inspection_runs r USING (run_id)
    WHERE r.part_id = 'P-4417' AND m.in_spec = false;
  must_contain: ["7 years"]

